<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      width: 350px;
    }
    h1 {
      margin-bottom: 20px;
    }
    input {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    button {
      background: #fff;
      color: #0072ff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0072ff;
      color: #fff;
    }
    .weather-info {
      margin-top: 20px;
      font-size: 18px;
    }
    .error {
      color: #ffb3b3;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Weather App</h1>
    <input type="text" id="locationInput" placeholder="Enter location..." />
    <br />
    <button onclick="getWeather()">Get Weather</button>
    <div class="weather-info" id="weatherInfo"></div>
    <div class="error" id="error"></div>
  </div>

  <script>
    async function getWeather() {
      const location = document.getElementById('locationInput').value.trim();
      const weatherInfo = document.getElementById('weatherInfo');
      const error = document.getElementById('error');
      weatherInfo.innerHTML = '';
      error.innerHTML = '';

      if (!location) {
        error.innerHTML = 'Please enter a location!';
        return;
      }

      const apiUrl = `https://api.weatherapi.com/v1/current.json?key=21fffc026e0a4b5eb35154408251510&q=${location}&aqi=yes`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error('Location not found');
        }
        const data = await response.json();

        const tempC = data.current.temp_c;
        const condition = data.current.condition.text;
        const city = data.location.name;
        const country = data.location.country;

        weatherInfo.innerHTML = `
          <p><strong>${city}, ${country}</strong></p>
          <p>Temperature: ${tempC}°C</p>
          <p>Condition: ${condition}</p>
        `;
      } catch (err) {
        error.innerHTML = 'Error fetching weather data. Please try again.';
      }
    }
  </script>
</body>
</html>
